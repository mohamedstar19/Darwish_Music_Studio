name: darwish-music-studio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published: the database is only reachable from the app container.
    # Caps so this site can never starve the other apps on the server.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    build: .
    image: darwish-music-studio:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dms:${POSTGRES_PASSWORD}@db:5432/dms
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PATH: ${ADMIN_PATH:-}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-com.darwishtech.dms}
      ANDROID_SHA256: ${ANDROID_SHA256:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-192k}
      PROCESS_CONCURRENCY: ${PROCESS_CONCURRENCY:-2}
      ACOUSTID_KEY: ${ACOUSTID_KEY:-}
      REQUIRE_STAFF_2FA: ${REQUIRE_STAFF_2FA:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${MEDIA_PATH:-./data/media}:/data/media
      # Drop songs here (any folder structure) and use "استيراد من السيرفر" in the admin panel.
      - ${IMPORT_PATH:-./data/import}:/data/import
    ports:
      - "${APP_PORT:-8095}:8080"
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 300
    # The app needs no special Linux privileges.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logs

  # Optional: public HTTPS for dms.darwish-tech.com through a Cloudflare Tunnel,
  # so no router ports need to be opened. Start with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2026.10.2
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  db-data:
